<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Wildrider — Electroacoustic Instrument</title>
  <link rel="stylesheet" href="/static/style.css?v=45" />
</head>
<body data-contrast="normal">
  <header id="topbar">
    <div class="brand">WILDRIDER<span class="sub">electroacoustic workbench</span></div>
    <div class="status">
      <span id="conn" class="pill bad">engine: offline</span>
      <span id="cpu" class="pill">cpu: –</span>
    </div>
    <div class="transport">
      <button id="btn-audio" title="Toggle live audio stream">▶ audio</button>
      <button id="btn-record" class="rec" title="Record the live stream to a CD-quality WAV">
        <span class="rec-dot"></span><span class="rec-label">record</span>
      </button>
      <button id="btn-recordings" title="Browse &amp; download recordings">⤓ recordings</button>
      <button id="btn-save" title="Save performance">save</button>
      <button id="btn-load" title="Load performance">load</button>
      <button id="btn-contrast" title="Toggle high-contrast accessibility mode">◐ contrast</button>
      <span id="user" class="pill" title="signed-in user"></span>
      <a id="btn-logout" href="/logout" title="Sign out">logout</a>
    </div>
    <audio id="player" hidden></audio>
  </header>

  <main>
    <div id="stack">
      <section id="canvas-wrap" aria-label="Patch canvas">
        <div id="canvas">
          <svg id="wires" width="4000" height="2400"></svg>
        </div>
        <button id="btn-add" class="canvas-btn" title="Add a module to the patch">＋</button>
        <button id="btn-rewire" class="canvas-btn" title="Rewire the patch — new connections only (params unchanged)">🔀</button>
        <button id="btn-clear" class="canvas-btn danger" title="Clear the entire patch">🧽</button>
      </section>
      <section id="detail" aria-label="Selected module"></section>
    </div>
    <aside id="side">
      <div class="panel" id="rand-panel">
        <h3>🎲 Randomizer</h3>
        <div class="rand-amt-row">
          <label for="rand-amt">amount</label>
          <input type="range" id="rand-amt" min="0" max="1" step="0.01" value="0.3">
          <span class="rand-amt-val" id="rand-amt-val">30%</span>
        </div>
        <div class="rand-buttons">
          <button id="btn-rand-all" title="Randomize — choose Patch, Params or Chain">🎲 Randomize</button>
        </div>
      </div>
      <div class="panel" id="meters-panel">
        <h3>VIZ — meters</h3>
        <div id="meters"></div>
      </div>
      <div class="panel" id="scenes-panel">
        <h3>Scenes</h3>
        <div id="scenes" class="scene-grid"></div>
        <div class="row">
          <button id="btn-add-scene" class="scene-act" title="Add a new scene slot">＋</button>
          <button id="btn-capture" class="scene-act" title="Store the current patch into the selected scene">💾</button>
        </div>
        <div class="row">
          <label>morph <input type="range" id="morph-time" min="0" max="30" step="0.1" value="0"> <span id="morph-time-val">0.0 s</span></label>
        </div>
      </div>
      <div class="panel" id="lfo-panel">
        <h3>Modulation — LFOs</h3>
        <div class="row">
          <label>count <input type="number" id="lfo-count" min="1" max="30" value="8" style="width:56px"></label>
          <button id="btn-lfo-rand" title="Randomize all LFO shapes, rates, depths and targets">🎲 randomize LFOs</button>
        </div>
        <div id="lfos"></div>
      </div>
      <div class="panel" id="mod-panel">
        <h3>Polyadic sources</h3>
        <div id="mod-sources"></div>
        <div class="row">
          <select id="src-type">
            <option value="random_continuous">random continuous</option>
            <option value="random_stepped">random stepped</option>
            <option value="controlled_macro">controlled macro</option>
            <option value="envelope">envelope</option>
            <option value="clock">clock / phasor</option>
            <option value="analysis">analysis follower</option>
            <option value="gesture">gesture</option>
          </select>
          <button id="btn-add-src">+ source</button>
        </div>
        <div id="mod-routes"></div>
      </div>
    </aside>
  </main>

  <div id="modal" hidden><div class="modal-card" id="modal-card"></div></div>
  <script src="/static/vendor/hls.min.js"></script>
  <script src="/static/app.js?v=45"></script>
</body>
</html>
